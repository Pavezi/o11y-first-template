version: '3.8'

services:
  # Jaeger - Trace Visualization
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # OTEL Collector (Optional but recommended for scale)
